version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries/requests.sql"
    schema: "db/migrations/"
    gen:
      go:
        package: "infra"
        out: "internal/request/infra"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: false
        overrides:
          - db_type: "pg_catalog.jsonb"
            go_type: "encoding/json.RawMessage"
  - engine: "postgresql"
    queries: "db/queries/endpoints.sql"
    schema: "db/migrations/"
    gen:
      go:
        package: "infra"
        out: "internal/endpoint/infra"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: false
