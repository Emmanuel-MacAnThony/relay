services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "5433:5432"
    volumes:
      - relay_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    # No host port here — Launchpad assigns the slot's host port (blue/green) via
    # its deploy-time override. Publishing one here would collide across slots.
    environment:
      DATABASE_URL: postgres://relay:relay@db:5432/relay?sslmode=disable
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  relay_data:
